name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build UI
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Formatting
        run: test -z "$(gofmt -l cmd internal)"

      - name: Module hygiene
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race ./...

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Audit web dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

      - name: Build binaries
        run: |
          go build -trimpath -o /tmp/phleetd ./cmd/phleetd
          go build -trimpath -o /tmp/phleet ./cmd/phleet

      - name: Build agents
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 GOTOOLCHAIN=go1.22.12 \
            GOFLAGS="-modfile=$PWD/go122.mod" \
            go build -trimpath -ldflags "-s -w" -o /tmp/phleet-agent-linux-arm64 ./cmd/phleet-agent
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 GOTOOLCHAIN=go1.22.12 \
            GOFLAGS="-modfile=$PWD/go122.mod" \
            go build -trimpath -ldflags "-s -w" -o /tmp/phleet-agent-linux-arm ./cmd/phleet-agent
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" -o /tmp/phleet-agent-linux-amd64 ./cmd/phleet-agent

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build UI
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Vet and test
        shell: bash
        run: |
          export GOTMPDIR="$RUNNER_TEMP/gotmp"
          mkdir -p "$GOTMPDIR"
          go vet ./...
          go test ./...
