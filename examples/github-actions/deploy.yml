name: Deploy project to phleet

# Copy this file into the repository of the project you want phleet to deploy,
# for example <your-project>/.github/workflows/deploy.yml.
#
# Repository secrets:   PHLEET_URL, PHLEET_TOKEN
# Repository variable:  PHLEET_PROJECT_ID
#
# Do not keep this workflow in the phleet control-plane repository: it would
# deploy phleet itself whenever the variable is set.

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: phleet project ID
        required: true
        type: string
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip the push trigger until the repository variable is configured.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.PHLEET_PROJECT_ID != '' }}
    steps:
      - name: Trigger deploy
        env:
          PHLEET_URL: ${{ secrets.PHLEET_URL }}
          PHLEET_TOKEN: ${{ secrets.PHLEET_TOKEN }}
          PROJECT_ID: ${{ inputs.project_id || vars.PHLEET_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "$PHLEET_URL" || { echo "PHLEET_URL secret is missing"; exit 1; }
          test -n "$PHLEET_TOKEN" || { echo "PHLEET_TOKEN secret is missing"; exit 1; }
          test -n "$PROJECT_ID" || { echo "project_id input or PHLEET_PROJECT_ID variable is missing"; exit 1; }

          response=$(curl -fsS -X POST \
            "$PHLEET_URL/api/projects/$PROJECT_ID/deploy" \
            -H "Authorization: Bearer $PHLEET_TOKEN")
          printf '%s\n' "$response" | jq .

          # A stack returns one entry per service replica. Reject the run if
          # phleet refused any part of it up front, or if a phone was offline
          # and the replica was skipped instead of started.
          rejected=$(printf '%s' "$response" | jq -r '[.deployments[] | select(.status == "failed" or .id == "")] | length')
          if [ "$rejected" -ne 0 ]; then
            echo "::error::phleet rejected part of the deployment: $response"
            exit 1
          fi
          skipped=$(printf '%s' "$response" | jq -r '.skipped // [] | join(", ")')
          if [ -n "$skipped" ]; then
            echo "::error::these phones were offline and did not accept the deployment: $skipped"
            exit 1
          fi

          ids=$(printf '%s' "$response" | jq -r '.deployments[].id')
          if [ -z "$ids" ]; then
            echo "::error::phleet did not start any deployment"
            exit 1
          fi
          printf '%s\n' "$ids" | sed '/^$/d' > "${RUNNER_TEMP:-/tmp}/phleet-deployments.txt"
          echo "tracking deployments:"
          cat "${RUNNER_TEMP:-/tmp}/phleet-deployments.txt"

      - name: Wait for every deployment
        env:
          PHLEET_URL: ${{ secrets.PHLEET_URL }}
          PHLEET_TOKEN: ${{ secrets.PHLEET_TOKEN }}
          PROJECT_ID: ${{ inputs.project_id || vars.PHLEET_PROJECT_ID }}
        run: |
          set -euo pipefail
          ids_file="${RUNNER_TEMP:-/tmp}/phleet-deployments.txt"
          mapfile -t ids < "$ids_file"
          declare -A status
          for id in "${ids[@]}"; do status[$id]=queued; done

          # Track each deployment separately. A stack can have several
          # services, and checking only the newest row would miss a failure in
          # another service. The project endpoint is readable with the deployer
          # token; /api/deployments/{id} includes build logs and is admin-only.
          for _ in $(seq 1 240); do
            remaining=0
            body=$(curl -fsS \
              -H "Authorization: Bearer $PHLEET_TOKEN" \
              "$PHLEET_URL/api/projects/$PROJECT_ID/deployments") || {
              echo "::warning::could not poll deployments; retrying"
              remaining=1
              continue
            }
            for id in "${ids[@]}"; do
              case "${status[$id]}" in
                active | failed | rolled_back) continue ;;
              esac
              state=$(printf '%s' "$body" | jq -r --arg id "$id" \
                '[.deployments[] | select(.id == $id)][0].status // "unknown"')
              detail=$(printf '%s' "$body" | jq -r --arg id "$id" \
                '[.deployments[] | select(.id == $id)][0].detail // ""')
              status[$id]=$state
              echo "$id: $state"
              case "$state" in
                active) ;;
                failed | rolled_back)
                  echo "::error::deployment $id ended as $state: $detail"
                  ;;
                *) remaining=1 ;;
              esac
            done

            if [ "$remaining" -eq 0 ]; then
              for id in "${ids[@]}"; do
                if [ "${status[$id]}" != active ]; then
                  echo "::error::deployment $id ended as ${status[$id]}"
                  exit 1
                fi
              done
              echo "all ${#ids[@]} deployment(s) are active"
              exit 0
            fi
            sleep 5
          done

          for id in "${ids[@]}"; do
            echo "deployment $id is still ${status[$id]}"
          done
          echo "::error::timed out waiting for every deployment"
          exit 1
